# Area labels for actions/labeler (v5+ syntax). See .github/workflows/labeler.yml.
# `dependencies` is deliberately absent: Dependabot applies it itself, and
# sync-labels would otherwise remove it from PRs that bump actions or hooks.
persona:
  - changed-files:
      - any-glob-to-any-file: ["personas/**"]
code:
  - changed-files:
      - any-glob-to-any-file: ["src/**"]
tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md"]
ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**", ".pre-commit-config.yaml"]
