name: Bug report
description: Something in moodsona does not work as documented.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste API keys, real user conversations
        or other private data. For security issues use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest script or persona file that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Error output / traceback
      render: shell
  - type: input
    id: version
    attributes:
      label: moodsona version
      placeholder: "python -c 'import moodsona; print(moodsona.__version__)'"
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python version
      options: ["3.11", "3.12", "3.13", other]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, other]
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Model provider
      options: [none / offline, anthropic, openai, other]
