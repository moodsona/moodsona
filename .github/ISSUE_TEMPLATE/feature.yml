name: Feature request
description: Propose a new capability or a change in behaviour.
title: "feat: "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Please open an issue before writing a large PR, so we can agree on the
        direction first. Small fixes can go straight to a PR.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to test or build, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API sketch, config example or expected output.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself
