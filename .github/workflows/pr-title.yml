# PR title must be a Conventional Commit: PRs are squash-merged, so the title
# becomes the commit on main that release-please reads to pick the next
# version and write the changelog. Required check in the ruleset: `pr-title`.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # `persona` is project-specific: a new or changed persona file.
          types: |
            feat
            fix
            persona
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" of the PR title "{title}" must start with a
            lowercase letter, e.g. "persona: add grieving-widower".
