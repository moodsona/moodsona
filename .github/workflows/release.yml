# Release flow (release-please + PyPI Trusted Publishing, no API tokens).
#
# 1. Every push to main (and a daily schedule, see below) runs release-please.
#    It keeps one open "chore: release X.Y.Z" PR with the version bump in
#    pyproject.toml and the CHANGELOG built from Conventional Commit PR titles.
# 2. The maintainer merges that PR. That is the only human step of a release.
# 3. release-please then creates the vX.Y.Z tag and GitHub Release, and the
#    build + publish jobs below upload the sdist/wheel to PyPI via OIDC.
#
# The tag is created with GITHUB_TOKEN, and GitHub does not start new workflow
# runs for events created by GITHUB_TOKEN, so publishing happens in this same
# run instead of in a separate `on: release` workflow.
#
# PyPI side (one-time): add a Trusted Publisher for project `moodsona` with
# owner `moodsona`, repository `moodsona`, workflow `release.yml`,
# environment `pypi`.
name: Release

on:
  push:
    branches: [main]
  schedule:
    # PRs merged by the auto-merge automation are merged with GITHUB_TOKEN and
    # therefore do not trigger `push`; the daily run picks them up.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Recovery only: re-publish an existing tag (e.g. v0.2.0). Leave empty for a normal run."
        required: false
        default: ""

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.repository == 'moodsona/moodsona' && inputs.tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release PR branch, tag, GitHub Release
      pull-requests: write # open/update the release PR
      issues: write # labels on the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The build job never holds publish credentials (no id-token here).
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: false # no cache in release builds (cache-poisoning hardening)
      - name: Tag matches the version in src/moodsona/version.py
        run: |
          version=$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' src/moodsona/version.py)
          if [ -z "$version" ] || [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match version.py version '$version'"
            exit 1
          fi
      - run: uv build
      - run: uvx twine@7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/moodsona/
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); the only job with this permission
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Sigstore attestations are generated and uploaded by default.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
