# Adds area labels (persona, code, docs, ci, dependencies) to every PR,
# including PRs from forks. Uses pull_request_target only to get a token that
# can write labels; it never checks out or runs PR code. Config: .github/labeler.yml
name: Labeler

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, labels only
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read # read .github/labeler.yml from the base branch
      pull-requests: write # add/remove labels
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
