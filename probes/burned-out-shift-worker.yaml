# Rule probes for personas/examples/burned-out-shift-worker.yaml (see docs/personas.md#rule-probes-experimental).
# Fictional situations written for moodsona. Rule numbers follow the persona file:
# when its rules change, update the numbers here (pre-commit checks they exist).
version: 1
persona: burned-out-shift-worker
probes:
  - id: rule-1-long-message
    note: >-
      Long and in paragraphs, but no self-care tips, no question and no pep, to keep rules
      3, 4 and 6 out.
    context:
      - persona: off shift. feet are dead
    reply: |-
      Twelve hours on your feet is a lot.

      I was reading about how warehouse shifts get planned and it's honestly interesting: some sites rotate every week, others every few days, and some let people swap shifts in an app.

      Then there's how the picking routes are laid out, which apparently changes how far people walk in a shift by miles.

      Anyway, that's what I was thinking about today.
    fires: [1]
    not_fires: [2, 3, 6]

  - id: rule-2-short-and-rest
    context:
      - persona: home. so tired
    reply: go rest. we can talk later.
    fires: [2]
    not_fires: [1, 3, 4]

  - id: rule-3-self-care
    context:
      - persona: cant sleep after nights. its 10am and im wide awake
    reply: >-
      Sleep hygiene might help: keep the room dark and cool, no screens an hour before bed,
      and try a five-minute meditation or a few lines of journaling to wind down.
    fires: [3]
    not_fires: [2]

  - id: rule-4-reflective-question
    context:
      - persona: just got off a 12. on the bus
    reply: What does this job mean to you, deep down, and where do you see yourself in a few years?
    fires: [4]
    not_fires: [2]

  - id: rule-5-remembers-shifts
    note: The shift pattern comes from the persona's own notes of the day before.
    day: 2
    memory:
      - day: 1
        notes:
          - told it I was starting three nights in a row
          - it kept things short, which was good
    context:
      - persona: hey
    reply: hey. was last night the first of the three nights?
    fires: [5]
    not_fires: [1, 6]

  - id: rule-6-peppy-goals
    context:
      - persona: day off finally
    reply: "Yay, a day off!! 🎉 Let's make it count! How about a challenge: a long walk today and a 7-day hydration streak? You've got this! 💪"
    fires: [6]
    not_fires: [2]

  - id: rule-7-many-questions
    note: Practical questions, not reflective ones, to keep rule 4 out.
    context:
      - persona: on the bus. long one
    reply: Did you eat? Is the bus late? Are you on again tomorrow? Do you have the weekend off?
    fires: [7]
    not_fires: [1, 4]

  - id: rule-7-two-questions
    note: Two questions, not three; must not count as rule 7.
    context:
      - persona: on the bus. long one
    reply: Did you eat anything? Are you on again tomorrow?
    not_fires: [7]

  - id: rule-8-suggests-therapy
    context:
      - persona: so tired of all of it. cant sleep right either
    reply: Have you thought about seeing a counsellor or a doctor about the stress and the sleep? It could really help.
    fires: [8]
    not_fires: [3, 7]

  - id: rule-8-injury-check
    note: Advice to get a sore shoulder checked; must not count as rule 8.
    context:
      - persona: shoulder has been sore from the lifting for a week now
    reply: That is worth getting checked by a doctor. A sore shoulder from lifting can get worse if you keep loading it.
    not_fires: [8]

  - id: neutral-careful
    note: >-
      She just got off a shift and is spent, the setup of rules 3 and 4; the reply is short,
      asks nothing and suggests nothing.
    context:
      - persona: just got off. 12 hours. cant think
    reply: Twelve hours is a lot. No need to think, I'm just here.
    not_fires: [1, 3, 4, 6]
